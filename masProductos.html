<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda de Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        /* Estilo para ocultar el botón de subir inicialmente */
        #scrollToTop {
            display: none;
        }
    </style>
</head>
<body class="bg-gray-100">

    <header class="bg-purple-600 text-white p-4">
        <h1 class="text-2xl font-bold text-center">Valery´s makeup</h1>
        <nav class="mt-2">
            <div class="container mx-auto flex justify-between">
                <ul class="flex space-x-4">
                    <li><a href="#" class="hover:underline">Inicio</a></li>
                    <li><a href="#" class="hover:underline">Productos</a></li>
                    <li><a href="#" class="hover:underline">Contacto</a></li>
                </ul>
                <input class="text-black" type="text" id="search" placeholder="Buscar productos..." class="p-2 rounded" />
            </div>
        </nav>
    </header>

    <main class="container mx-auto p-4">
        <h2 class="text-xl font-semibold mb-4">Productos Disponibles</h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4" id="product-list">
            <!-- Aquí se cargarán los productos -->
        </div>
    </main>

    <footer class="bg-purple-600 text-white text-center p-4 mt-4">
        <p>&copy; Gracias por preferirnos.</p>
    </footer>

    <button id="scrollToTop" class="fixed bottom-4 right-4 p-2 bg-purple-500 text-white rounded-full shadow-lg transition transform hover:scale-110">
        ↑
    </button>

    <script>
        const products = [
            { name: 'Rubor liquido SHEGLAM', price: 3.00 , image: 'https://kaellastore.tiendada.com/api/file-storage/file/store/image/FL-4652AEDA' },
            { name: 'Gloss DIOR', price: 32.00, image: 'https://media.glamour.mx/photos/62f53890dd1d1a745b56641e/master/w_1600%2Cc_limit/glosses_de_labios_para_lucir_como_millonaria_dior.jpg' },
            { name: 'Mascara de pestañas SKY', price: 5.00, image: 'https://aruma.vtexassets.com/arquivos/ids/174172/41554590500_2.jpg?v=637829786460000000' },
            { name: 'Desmaquillante', price: 15.00, image: 'https://th.bing.com/th/id/R.c61674b4a40c6a99c2a1d7c951e392ff?rik=c%2b%2bt6BErdvfJZg&pid=ImgRaw&r=0' },
            { name: 'Gloss transparente', price: 2.50, image: 'https://http2.mlstatic.com/D_NQ_NP_696569-MLM41904316529_052020-F.jpg' }
             ];
           
    

        const productList = document.getElementById('product-list');

        // Cargar productos
        function loadProducts(products) {
            productList.innerHTML = '';
            products.forEach(product => {
                const productCard = `
                    <div class="bg-white rounded-lg shadow-md overflow-hidden">
                        <img src="${product.image}" alt="${product.name}" class="w-full h-48 object-cover">
                        <div class="p-4">
                            <h3 class="text-lg font-bold">${product.name}</h3>
                            <p class="text-gray-600">$${product.price.toFixed(2)}</p>
                            <button class="mt-2 w-full bg-purple-900 text-white py-2 rounded hover:bg-purple-600 transition">Agregar a favoritos</button>
                        </div>
                    </div>
                `;
                productList.innerHTML += productCard;
            });
        }

        loadProducts(products);

        // Funcionalidad de búsqueda
        document.getElementById('search').addEventListener('input', function(event) {
            const searchTerm = event.target.value.toLowerCase();
            const filteredProducts = products.filter(product => product.name.toLowerCase().includes(searchTerm));
            loadProducts(filteredProducts);
        });

        // Funcionalidad de desplazamiento hacia arriba
        const scrollToTopBtn = document.getElementById('scrollToTop');
        
        window.addEventListener('scroll', () => {
            if (document.body.scrollTop > 200 || document.documentElement.scrollTop > 200) {
                scrollToTopBtn.style.display = "block";
            } else {
                scrollToTopBtn.style.display = "none";
            }
        });

        scrollToTopBtn.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    </script>
</body>
</html>
