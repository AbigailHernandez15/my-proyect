<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="main.js" defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Document</title>
</head>
   
 <body class="bg-purple-500 font-sans flex items-center justify-center h-screen">
    
        <div class="bg-white p-6 rounded-lg shadow-md w-96">
            <h2 class="text-2xl font-bold mb-6 text-center">Registro</h2>
            <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST" id="registro-form">
                <div class="mb-4">
                    <label class="block text-gray-700" for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" class="mt-1 block w-full p-2 border border-gray-300 rounded-md" require>
                </div>

                <div class="mb-4">
                    <label class="block text-gray-700" for="contraseña">Apellidos</label>
                    <input type="text" id="apellidos" name="apellidos" class="mt-1 block w-full p-2 border border-gray-300 rounded-md" required>
                </div>
    
                <div class="mb-4">
                    <label class="block text-gray-700" for="correo">Correo Electrónico</label>
                    <input type="email" id="correo" name="correo" class="mt-1 block w-full p-2 border border-gray-300 rounded-md" required>
                </div>
    
                <div class="mb-4">
                    <label class="block text-gray-700" for="contraseña">Telefóno</label>
                    <input type="text" id="telefono" name="telefono" class="mt-1 block w-full p-2 border border-gray-300 rounded-md" required>
                </div>

    
                <button id="miBoton" onclick="cambiarPagina()" class="bg-blue-700 m-4 text-white font-bold py-2 px-4 rounded hover:bg-blue-900">
                    Enviar
             
                   <script>
                    document.getElementById("miBoton").addEventListener("click", function() {
                        window.location.href = "cuenta.html";
                    });
                   </script>
                </button>

            <div id="success-message" class="hidden mt-4 text-green-600 text-center">
                ¡Registro exitoso!
            </div>
    
            <div id="error-message" class="hidden mt-4 text-red-600 text-center">
                Ocurrió un error. Verifica que hayas colocado todos los datos o intenta nuevamente.
            </div>
        </div>
